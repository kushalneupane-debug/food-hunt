# Local MySQL 8 for development. Start with: docker compose up -d db
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: foodhunt
      MYSQL_USER: foodhunt
      MYSQL_PASSWORD: foodhunt_dev_pw
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
