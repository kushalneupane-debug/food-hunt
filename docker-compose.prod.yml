# Production stack for the AWS EC2 server.
# Run from the repo root:  docker compose -f docker-compose.prod.yml up -d --build
# Passwords come from a .env file next to this file (created by deploy/ec2-setup.sh).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Saves ~200 MB of RAM on a small (1 GB) EC2 instance
    command: ["--performance-schema=OFF"]
    # MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD come from .env on the server
    # (generated by deploy/ec2-setup.sh, never committed to Git)
    env_file: .env
    environment:
      MYSQL_DATABASE: foodhunt
      MYSQL_USER: foodhunt
    volumes:
      - dbdata:/var/lib/mysql
      # Runs once, the first time the database volume is created
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # No "ports:" on purpose: MySQL is only reachable by the app container.

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodhunt
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: foodhunt
    ports:
      - "80:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
